# Stage 1: pre-train the latent-space Retinex decomposition network (CTDN)
data:
  type: LLdataset
  data_dir: ./data/LOL
  train_dataset: LOL
  val_dataset: LOL
  patch_size: 256
  num_workers: 4
  ckpt_dir: ./ckpt/stage1

model:
  channels: 64

training:
  n_epochs: 100
  batch_size: 8
  validation_freq: 500

sampling:
  batch_size: 1

optim:
  optimizer: Adam
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0
  lr_scheduler: step      # step: decay 0.5 every 50 epochs | cosine

loss:
  weight_recon: 1.0
  weight_reflectance: 1.0
  weight_smooth: 0.01
  weight_illumination: 0.1
